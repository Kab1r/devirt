name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Kept in sync with the `vstd` crate version in Cargo.toml by Renovate
  # (see .github/renovate.json5 — the `verus` group bundles the two updates).
  VERUS_TAG: release/0.2026.08.30.b432e82
  # Tracked by Renovate (see .github/renovate.json5).
  KANI_VERSION: 0.68.0

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --exclude devirt-fuzz

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --exclude devirt-fuzz --all-targets -- -D warnings

  bench-check:
    name: Bench compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo bench --workspace --exclude devirt-fuzz --no-run

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Miri ships as a nightly component; pin the toolchain explicitly
      # so we can request the `miri` component alongside nightly rustc.
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `cargo miri test -p devirt --lib` exercises the fat-pointer
      # transmute, the vtable identity primitives, and the &mut
      # dispatch path under Stacked/Tree Borrows. The lib tests are
      # the only ones Miri needs to check — the trybuild UI tests
      # don't exercise any unsafe code and Kani has its own harness.
      - run: cargo +nightly miri test -p devirt --lib
      # The proc-macro attribute emits its own dispatch code, which the
      # lib tests above do not cover. Miri randomises vtable addresses
      # per coercion, so the hot branch is only taken on some seeds;
      # run many so both branches are checked.
      - run: cargo +nightly miri test -p devirt --test equivalence
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..32 -Zmiri-strict-provenance

  kani:
    name: Kani
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cache Kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-kani
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}
      - name: Install Kani
        if: steps.cache-kani.outputs.cache-hit != 'true'
        run: |
          # rust-cache can restore a stale ~/.cargo/bin/cargo-kani even when
          # the Kani cache above misses, so overwrite it.
          cargo install kani-verifier --locked --force --version "$KANI_VERSION"
          cargo kani setup
      - run: cargo kani --tests -p devirt

  verus:
    name: Verus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Verus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-verus
        with:
          path: ~/.verus
          key: verus-${{ env.VERUS_TAG }}-${{ runner.os }}
      - name: Install Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          VERSION="${VERUS_TAG#release/}"
          curl -fsSL "https://github.com/verus-lang/verus/releases/download/${VERUS_TAG}/verus-${VERSION}-x86-linux.zip" -o verus.zip
          mkdir -p ~/.verus
          unzip -q verus.zip -d ~/.verus
      - name: Determine Rust toolchain required by Verus
        # Verus ships as a prebuilt binary that shells out to a specific rustc
        # via rustup — `stable` is not sufficient and the required version
        # changes across releases. Read it from the release's version.json
        # so that Renovate only has to bump `VERUS_TAG`.
        id: verus-toolchain
        run: |
          toolchain=$(jq -r '.verus.toolchain' ~/.verus/verus-x86-linux/version.json)
          toolchain="${toolchain%-x86_64-unknown-linux-gnu}"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain required by Verus
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.verus-toolchain.outputs.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Add Verus to PATH
        # The release zip extracts to a `verus-x86-linux/` subdirectory that
        # contains the `verus` binary alongside its runtime assets (z3,
        # libvstd.rlib, vstd.vir, etc.). The binary must stay next to those
        # files, so we add the subdirectory itself to PATH.
        run: echo "$HOME/.verus/verus-x86-linux" >> "$GITHUB_PATH"
      - run: verus crates/verify/src/lib.rs --crate-type=lib
