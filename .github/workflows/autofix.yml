name: Autofix

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs project and dependency code (build scripts, proc macros), so it
  # gets a read-only token and no persisted credentials. The result is
  # handed to `apply` as a patch.
  fix:
    name: Compute Rust autofixes
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Apply rustfmt and Clippy fixes
        run: |
          cargo fmt --all
          cargo clippy --fix --workspace --exclude devirt-fuzz --all-targets \
            --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
      - name: Detect changes
        id: changes
        run: |
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1

  # Holds the write token and runs no project code: it only applies the
  # patch, restricted to Rust sources, and pushes.
  apply:
    name: Apply Rust autofixes
    needs: fix
    if: needs.fix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}
      - name: Commit and push fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git apply --include='*.rs' "$RUNNER_TEMP/autofix.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          git commit -m "Apply Rust autofixes"
          git push origin "HEAD:$branch"
          gh workflow run ci.yml --ref "$branch"

  check-fork:
    name: Check Rust formatting
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
