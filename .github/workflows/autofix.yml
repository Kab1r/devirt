name: Autofix

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs project and dependency code (build scripts, proc macros), so it
  # gets a read-only token and no persisted credentials. The result is
  # handed to `apply` as a patch.
  fix:
    name: Compute Rust autofixes
    if: >-
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all
      # Clippy compiles the workspace, which runs dependency build scripts
      # and proc macros, and whatever it writes is pushed by `apply`. Only
      # do that on pull requests, where the result is reviewed before it
      # merges. Pushes to main get rustfmt only, which runs no project code.
      - name: Apply Clippy fixes
        if: github.event_name == 'pull_request'
        run: |
          cargo clippy --fix --workspace --exclude devirt-fuzz --all-targets \
            --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
      - name: Detect changes
        id: changes
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1

  # Holds the write token and runs no project code: it only applies the
  # patch, restricted to Rust sources, and pushes.
  apply:
    name: Apply Rust autofixes
    needs: fix
    if: needs.fix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit the patch was computed against, not the branch tip.
          ref: ${{ needs.fix.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}
      - name: Commit and push fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git apply --include='*.rs' "$RUNNER_TEMP/autofix.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          git commit -m "Apply Rust autofixes"
          git push origin "HEAD:$branch"
          gh workflow run ci.yml --ref "$branch"

  check-fork:
    name: Check Rust formatting
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
